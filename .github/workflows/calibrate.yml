name: Calibrate

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD'
        required: true
        default: '2026-08-01'
      baba:
        description: '44=大井 50=園田 54=高知'
        required: true
        default: '44'
      race:
        description: 'レース番号'
        required: true
        default: '11'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          python -m nar.calibrate \
            --date "${{ github.event.inputs.date }}" \
            --baba "${{ github.event.inputs.baba }}" \
            --race "${{ github.event.inputs.race }}"
