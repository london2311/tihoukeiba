name: Calibrate

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD'
        required: true
        default: '2026-08-12'
      baba:
        description: '20=大井 27=園田 31=高知 19=船橋 21=川崎 24=名古屋'
        required: true
        default: '20'
      race:
        description: 'レース番号'
        required: true
        default: '9'
      odds:
        description: '確認する券種'
        required: false
        default: 'win,place,trifecta'
      probe_full:
        description: '全件表示パラメータを探索する券種 (trifecta など)'
        required: false
        default: 'trifecta'
      inspect:
        description: '構造ダンプする券種 (空なら無し)'
        required: false
        default: ''
      inspect_payout:
        description: '払戻の構造もダンプ'
        type: boolean
        required: false
        default: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          python -m nar.calibrate \
            --date "${{ github.event.inputs.date }}" \
            --baba "${{ github.event.inputs.baba }}" \
            --race "${{ github.event.inputs.race }}" \
            --odds "${{ github.event.inputs.odds }}" \
            --probe-full "${{ github.event.inputs.probe_full }}" \
            --inspect "${{ github.event.inputs.inspect }}" \
            ${{ github.event.inputs.inspect_payout == 'true' && '--inspect-payout' || '' }}
