name: Analyze

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report / calibrate / both'
        required: true
        default: 'both'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: nar-db-main
          path: data/
      - name: Report
        if: contains(github.event.inputs.mode, 'report') || github.event.inputs.mode == 'both'
        run: python -m nar.analyze --report
      - name: Calibrate
        if: contains(github.event.inputs.mode, 'calibrate') || github.event.inputs.mode == 'both'
        run: python -m nar.analyze --calibrate
