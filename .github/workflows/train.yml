name: Train

on:
  workflow_dispatch:
    inputs:
      sweep:
        description: '総当たり比較モード（模型2 x 特徴4通り x 正則化2段階）'
        type: boolean
        required: false
        default: false
      exact:
        description: '厳密な条件付きロジットを使う（既定は従来の近似）'
        type: boolean
        required: false
        default: false
      with_market:
        description: '市場の人気順位を特徴に入れる（市場を土台にして補正する方針）'
        type: boolean
        required: false
        default: false
      with_odds:
        description: '実オッズを特徴に入れ、オッズ完備3,412レースだけで学習・検証する'
        type: boolean
        required: false
        default: false
      cutoff:
        description: '学習/検証の境界日 (空ならオッズ完備開始日)'
        required: false
        default: ''
      C:
        description: '正則化 (小さいほど強い)'
        required: false
        default: '1.0'
      min_starts:
        description: '過去N走未満の馬を除く'
        required: false
        default: '3'
      temp:
        description: '温度較正を有効にする（既定オフ。検証期で外れる実測あり）'
        type: boolean
        required: false
        default: false
      run_id:
        description: 'nar-db-main の実行ID (空ならサイズ最大を自動選択)'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # ★作成日時ではなくサイズで選ぶ★ 空DB(約100KB)が最新に来ることがある
      - name: Find DB
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            echo "run_id=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "指定された run_id を使用: ${{ github.event.inputs.run_id }}"
            exit 0
          fi
          API="repos/${{ github.repository }}/actions/artifacts?per_page=100"
          JQ='.artifacts[] | select(.name=="nar-db-main" and .expired==false) | "\(.size_in_bytes)\t\(.workflow_run.id)\t\(.created_at)"'
          gh api --paginate "$API" --jq "$JQ" | sort -rn > /tmp/arts.tsv
          echo "=== nar-db-main の候補 (サイズ降順) ==="
          echo "bytes | run_id | created_at"
          cat /tmp/arts.tsv
          if [ ! -s /tmp/arts.tsv ]; then
            echo "!! nar-db-main が1件も無い。Restore DB を先に実行すること"
            exit 1
          fi
          SIZE=$(head -1 /tmp/arts.tsv | cut -f1)
          RID=$(head -1 /tmp/arts.tsv | cut -f2)
          if [ "$SIZE" -lt 5000000 ]; then
            echo "!! 最大でも ${SIZE} bytes。全部空DB。Restore DB で作り直すこと"
            exit 1
          fi
          echo "採用: run_id=$RID (${SIZE} bytes)"
          echo "run_id=$RID" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: nar-db-main
          path: data/
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        run: |
          python - <<'EOF'
          import sqlite3, sys, pathlib
          p = pathlib.Path("data/nar.db")
          if not p.exists():
              sys.exit("!! data/nar.db が無い")
          print(f"nar.db = {p.stat().st_size/1024/1024:,.1f} MB")
          c = sqlite3.connect(p)
          n = c.execute("SELECT COUNT(*) FROM races").fetchone()[0]
          o = c.execute("SELECT COUNT(*) FROM results WHERE final_win_odds IS NOT NULL").fetchone()[0]
          print(f"races={n:,} odds={o:,}")
          if n < 1000:
              sys.exit(f"!! races が {n} 件しかない。空DBを掴んでいる")
          EOF

      - name: Train
        run: |
          python -m nar.train \
            ${{ github.event.inputs.sweep == 'true' && '--sweep' || '' }} \
            ${{ github.event.inputs.exact == 'true' && '--exact' || '' }} \
            ${{ github.event.inputs.with_market == 'true' && '--with-market' || '' }} \
            ${{ github.event.inputs.with_odds == 'true' && '--with-odds' || '' }} \
            ${{ github.event.inputs.temp == 'true' && '--temp' || '' }} \
            ${{ github.event.inputs.cutoff && format('--cutoff {0}', github.event.inputs.cutoff) || '' }} \
            --C ${{ github.event.inputs.C || '1.0' }} \
            --min-starts ${{ github.event.inputs.min_starts || '3' }}
