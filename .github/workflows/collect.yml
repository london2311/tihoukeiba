name: NAR backfill (sharded)

# Public リポジトリ必須。Private の無料枠(月2,000分)では初日に枯れる。
# 並列度は6が上限。相手はNAR公式サイト。合計リクエスト数で考えること。

on:
  workflow_dispatch:
    inputs:
      since:  { description: 'YYYY-MM-DD', required: false }
      until:  { description: 'YYYY-MM-DD', required: false }
      limit:  { description: '1シャードあたり件数', required: false, default: '4000' }
      odds:   { description: 'win / core / all', required: false, default: 'win' }
  schedule:
    - cron: '0 17 * * *'    # 02:00 JST

concurrency: { group: nar-backfill, cancel-in-progress: false }
env:
  SHARDS: 6
  TZ: Asia/Tokyo

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: nar-db-main, path: data/ }
      - name: Build queue
        if: github.event.inputs.since != ''
        run: |
          python -m nar.backfill \
            --since "${{ github.event.inputs.since }}" \
            --until "${{ github.event.inputs.until }}" \
            --limit 0
      - uses: actions/upload-artifact@v4
        with: { name: nar-db-seed, path: data/nar.db, retention-days: 7, overwrite: true }

  collect:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: nar-db-seed, path: data/ }
      - name: Collect
        run: |
          python -m nar.backfill \
            --shard ${{ matrix.shard }}/${{ env.SHARDS }} \
            --limit ${{ github.event.inputs.limit || 4000 }} \
            --odds ${{ github.event.inputs.odds || 'win' }} \
            --payout --interval 2.0 --hours 5.5
      - run: mv data/nar.db data/shard-${{ matrix.shard }}.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}.db
          retention-days: 3

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: nar-db-main, path: data/ }
      - uses: actions/download-artifact@v4
        with: { pattern: 'shard-*', path: shards/, merge-multiple: true }
      - run: |
          python -m nar.shards merge shards/*.db --out data/nar.db
          python -m nar.backfill --report
      - uses: actions/upload-artifact@v4
        with: { name: nar-db-main, path: data/nar.db, retention-days: 90, overwrite: true }
