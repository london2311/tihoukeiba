name: NAR backfill (sharded)

# ---------------------------------------------------------------------
# 前提: リポジトリは Public にすること。
#   Private だと無料枠 2,000分/月 に対し 6h x 6ジョブ = 2,160分 で初日に枯れる。
#   Public なら Actions は無制限。
#
# 並列度は 6 が上限。IPは分かれても相手側から見れば同一サイトへの合計
# リクエスト数。10並列は単純に迷惑だし、ブロックされたら全部終わる。
# ---------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      since:  { description: 'YYYY-MM-DD', required: false }
      until:  { description: 'YYYY-MM-DD', required: false }
      limit:  { description: '1シャードあたり件数', required: false, default: '12000' }
      shards: { description: '並列数(最大6)', required: false, default: '6' }
  schedule:
    - cron: '0 17 * * *'    # 02:00 JST

concurrency: { group: nar-backfill, cancel-in-progress: false }

env:
  SHARDS: 6
  TZ: Asia/Tokyo

jobs:
  # -------------------------------------------------------------------
  # 1) 開催日カレンダーを先読みして、実在レースだけキューに積む
  #    総当たりだと7割が404の空撃ちになる。ここで1/3に減る。
  # -------------------------------------------------------------------
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: nar-db-main, path: data/ }

      - name: Build queue from calendar
        if: github.event.inputs.since != ''
        run: |
          python -m nar.shards calendar \
            --since "${{ github.event.inputs.since }}" \
            --until "${{ github.event.inputs.until || github.event.inputs.since }}"

      - uses: actions/upload-artifact@v4
        with:
          name: nar-db-seed
          path: data/nar.db
          retention-days: 7
          overwrite: true

  # -------------------------------------------------------------------
  # 2) シャード並列で収集。各ジョブは別VM・別IP。
  #    rowid % n で担当が決まるので、空DBから始めても重複しない。
  # -------------------------------------------------------------------
  collect:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with: { name: nar-db-seed, path: data/ }

      - name: Collect shard ${{ matrix.shard }}
        run: |
          python -m nar.backfill \
            --shard ${{ matrix.shard }}/${{ env.SHARDS }} \
            --limit ${{ github.event.inputs.limit || 12000 }} \
            --interval 2.0 \
            --hours 5.5

      - name: Rename for merge
        run: mv data/nar.db data/shard-${{ matrix.shard }}.db

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}.db
          retention-days: 3

  # -------------------------------------------------------------------
  # 3) 統合 + リーク検査
  # -------------------------------------------------------------------
  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt

      # 前日までの累積DB
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: nar-db-main, path: data/ }

      - uses: actions/download-artifact@v4
        with: { pattern: 'shard-*', path: shards/, merge-multiple: true }

      - name: Merge
        run: |
          python -m nar.shards merge shards/*.db --out data/nar.db
          python -m nar.backfill --report

      - name: Leak check
        run: |
          python -c "import sys;sys.path.insert(0,'.');\
          from nar import core,features;features.assert_no_leak(features.build(core.connect()))"

      - uses: actions/upload-artifact@v4
        with:
          name: nar-db-main
          path: data/nar.db
          retention-days: 90
          overwrite: true
